server:
  port: 8080

spring:
  application:
    name: order-ai-backend
  datasource:
    # TiDB Cloud 强制 TLS；verifyServerCertificate=false 跳过自签 CA 校验，本地 MySQL 8 亦兼容
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:order_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ai:
  qwen:
    base-url: ${QWEN_BASE_URL:}
    api-key: ${QWEN_API_KEY:}
    model: ${QWEN_MODEL:qwen-max}
    chat-path: /chat/completions
    connect-timeout: 3s
    response-timeout: 60s
    overall-timeout: 90s
    max-retries: 2
    retry-backoff: 1s

logging:
  level:
    root: info
