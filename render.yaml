services:
  # 后端 Spring Boot（Docker），数据库使用 TiDB Serverless 免费集群
  - type: web
    name: order-ai-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Render 通过 PORT 指定监听端口，Spring Boot 使用 SERVER_PORT 对应
      - key: SERVER_PORT
        value: 10000
      # 以下数据库连接信息在 Render 控制台填写（TiDB Serverless 的 MySQL 协议端点）
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USERNAME
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen-max
      # 首次部署时在 Render 控制台填写真实密钥
      - key: QWEN_API_KEY
        sync: false

  # 前端 Next.js
  - type: web
    name: order-ai-frontend
    runtime: node
    plan: free
    buildCommand: npm i -g pnpm@9 && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      # 自动取后端服务的主机名，前端代码会补全 https://
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: order-ai-backend
          property: host
